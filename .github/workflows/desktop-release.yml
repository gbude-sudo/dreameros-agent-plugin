name: Desktop Release

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "desktop/agent/**"
      - "release/**"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:
    inputs:
      channel:
        description: candidate or stable
        required: true
        default: candidate
        type: choice
        options: [candidate, stable]
      version:
        description: Semantic desktop agent version
        required: true
        default: "0.2.0"

jobs:
  validate-stable:
    if: github.event_name == 'workflow_dispatch' && inputs.channel == 'stable'
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = "refs/heads/main"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate one strict version across every release surface
        run: python release/validate_release_version.py "$RELEASE_VERSION"

  build-candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x86_64
          - os: macos-14
            artifact: macos-arm64
          - os: ubuntu-latest
            artifact: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e desktop/agent -r release/requirements-build.txt
      - run: python -m unittest discover -s desktop/agent/tests -v
      - run: python release/test_build_manifest.py
      - run: pyinstaller --clean --onefile --name dreameros-agent --paths desktop/agent/src desktop/agent/build_entry.py
      - if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install innosetup --no-progress -y
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' release\windows\installer.iss "/DSourceExe=$pwd\dist\dreameros-agent.exe" "/DOutputDir=$pwd\dist\package"
      - name: Smoke test candidate Windows install and uninstall
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = Join-Path $env:LOCALAPPDATA 'DreamerOS\Agent'
          $installedAgent = Join-Path $installDir 'dreameros-agent.exe'
          $uninstaller = Join-Path $installDir 'unins000.exe'
          $protocolKey = 'HKCU:\Software\Classes\dreameros'
          $candidateInstaller = Join-Path $pwd 'dist\package\DreamerOSAgentSetup.exe'
          $expectedVersion = python -c "from dreameros_agent import __version__; print(__version__)"
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($expectedVersion)) { throw 'Could not read the candidate agent version' }
          if (Test-Path -LiteralPath $installDir) { throw "Fresh runner install target already exists: $installDir" }
          if (Test-Path -LiteralPath $protocolKey) { throw "Fresh runner protocol key already exists: $protocolKey" }
          if (Get-Process -Name 'dreameros-agent' -ErrorAction SilentlyContinue) { throw 'Fresh runner agent process already exists' }
          if (-not (Test-Path -LiteralPath $candidateInstaller)) { throw "Candidate installer is missing: $candidateInstaller" }

          $smokeFailure = $null
          $cleanupFailure = $null
          try {
            $installerProcess = Start-Process -FilePath $candidateInstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-') -Wait -PassThru
            if ($installerProcess.ExitCode -ne 0) { throw "Candidate installer failed with exit code $($installerProcess.ExitCode)" }
            if (-not (Test-Path -LiteralPath $installedAgent)) { throw "Installed agent is missing: $installedAgent" }
            if (Get-Process -Name 'dreameros-agent' -ErrorAction SilentlyContinue) { throw 'Silent install launched the agent postinstall command' }

            & $installedAgent --help
            if ($LASTEXITCODE -ne 0) { throw "Installed agent --help failed with exit code $LASTEXITCODE" }
            $statusOutput = & $installedAgent status
            if ($LASTEXITCODE -ne 0) { throw "Installed agent status failed with exit code $LASTEXITCODE" }
            try {
              $status = $statusOutput | ConvertFrom-Json -ErrorAction Stop
            } catch {
              throw "Installed agent status did not return JSON: $($_.Exception.Message)"
            }
            if ([string]::IsNullOrWhiteSpace($status.agent_version)) { throw 'Installed agent status JSON has no agent_version' }
            if ($status.agent_version -ne $expectedVersion) { throw "Installed agent version $($status.agent_version) does not match $expectedVersion" }
          } catch {
            $smokeFailure = $_
          } finally {
            try {
              if (Test-Path -LiteralPath $uninstaller) {
                $uninstallerProcess = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
                if ($uninstallerProcess.ExitCode -ne 0) { throw "Candidate uninstaller failed with exit code $($uninstallerProcess.ExitCode)" }
              }
              if (Test-Path -LiteralPath $installedAgent) { throw "Installed agent remains after uninstall: $installedAgent" }
              if (Test-Path -LiteralPath $protocolKey) { throw "Protocol key remains after uninstall: $protocolKey" }
            } catch {
              $cleanupFailure = $_
            }
          }
          if ($smokeFailure -and $cleanupFailure) { throw "Candidate install smoke failed: $($smokeFailure.Exception.Message). Cleanup also failed: $($cleanupFailure.Exception.Message)" }
          if ($smokeFailure) { throw $smokeFailure }
          if ($cleanupFailure) { throw $cleanupFailure }
      - if: runner.os == 'macOS'
        run: |
          mkdir -p dist/pkgroot/usr/local/bin dist/package
          cp dist/dreameros-agent dist/pkgroot/usr/local/bin/dreameros-agent
          chmod +x release/macos/scripts/postinstall
          pkgbuild --root dist/pkgroot --scripts release/macos/scripts --identifier app.dreameros.desktop-agent --version 0.2.0 dist/package/DreamerOSAgent.pkg
      - if: runner.os == 'Linux'
        run: |
          mkdir -p dist/debroot/DEBIAN dist/debroot/usr/local/bin dist/debroot/usr/share/applications dist/package
          cp dist/dreameros-agent dist/debroot/usr/local/bin/dreameros-agent
          printf 'Package: dreameros-desktop-agent\nVersion: 0.2.0\nArchitecture: amd64\nMaintainer: DreamerOS\nDepends: gnupg, libsecret-tools, policykit-1, dpkg-sig\nDescription: DreamerOS desktop MCP conductor\n' > dist/debroot/DEBIAN/control
          cp release/linux/postinst dist/debroot/DEBIAN/postinst
          cp release/linux/dreameros-agent.desktop dist/debroot/usr/share/applications/dreameros-agent.desktop
          chmod 755 dist/debroot/DEBIAN/postinst
          dpkg-deb --build dist/debroot dist/package/dreameros-desktop-agent_0.2.0_amd64.deb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}-candidate
          path: dist/package/*
          if-no-files-found: error

  stable-signing-gate:
    if: github.event_name == 'workflow_dispatch' && inputs.channel == 'stable'
    needs: [build-candidate, validate-stable]
    runs-on: ubuntu-latest
    environment: desktop-stable-release
    env:
      DESKTOP_ED25519_PRIVATE_KEY_B64: ${{ secrets.DESKTOP_ED25519_PRIVATE_KEY_B64 }}
      DESKTOP_ED25519_KEY_ID: ${{ secrets.DESKTOP_ED25519_KEY_ID }}
      DESKTOP_ED25519_PUBLIC_KEY_B64: ${{ secrets.DESKTOP_ED25519_PUBLIC_KEY_B64 }}
      WINDOWS_CODESIGN_CERT_PFX_B64: ${{ secrets.WINDOWS_CODESIGN_CERT_PFX_B64 }}
      WINDOWS_CODESIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERT_PASSWORD }}
      WINDOWS_CODESIGN_SUBJECT: ${{ secrets.WINDOWS_CODESIGN_SUBJECT }}
      APPLE_INSTALLER_CERT_P12_B64: ${{ secrets.APPLE_INSTALLER_CERT_P12_B64 }}
      APPLE_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_APPLICATION_CERT_P12_B64: ${{ secrets.APPLE_APPLICATION_CERT_P12_B64 }}
      APPLE_APPLICATION_CERT_PASSWORD: ${{ secrets.APPLE_APPLICATION_CERT_PASSWORD }}
      APPLE_APPLICATION_SIGNING_IDENTITY: ${{ secrets.APPLE_APPLICATION_SIGNING_IDENTITY }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      APPLE_NOTARY_PRIVATE_KEY_B64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_B64 }}
      LINUX_PACKAGE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.LINUX_PACKAGE_SIGNING_PRIVATE_KEY_B64 }}
      LINUX_PACKAGE_SIGNING_PUBLIC_KEY_B64: ${{ secrets.LINUX_PACKAGE_SIGNING_PUBLIC_KEY_B64 }}
      LINUX_PACKAGE_SIGNING_KEY_ID: ${{ secrets.LINUX_PACKAGE_SIGNING_KEY_ID }}
    steps:
      - name: Require the full signing inventory
        run: |
          missing=0
          for name in DESKTOP_ED25519_PRIVATE_KEY_B64 DESKTOP_ED25519_KEY_ID DESKTOP_ED25519_PUBLIC_KEY_B64 WINDOWS_CODESIGN_CERT_PFX_B64 WINDOWS_CODESIGN_CERT_PASSWORD WINDOWS_CODESIGN_SUBJECT APPLE_INSTALLER_CERT_P12_B64 APPLE_INSTALLER_CERT_PASSWORD APPLE_SIGNING_IDENTITY APPLE_APPLICATION_CERT_P12_B64 APPLE_APPLICATION_CERT_PASSWORD APPLE_APPLICATION_SIGNING_IDENTITY APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID APPLE_NOTARY_PRIVATE_KEY_B64 LINUX_PACKAGE_SIGNING_PRIVATE_KEY_B64 LINUX_PACKAGE_SIGNING_PUBLIC_KEY_B64 LINUX_PACKAGE_SIGNING_KEY_ID; do
            if [ -z "${!name}" ]; then echo "Missing required secret name: $name"; missing=1; fi
          done
          exit "$missing"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Prove the configured public key matches the signing key
        run: |
          python -m pip install cryptography==50.0.0
          python - <<'PY'
          import base64, os, secrets
          from cryptography.hazmat.primitives import serialization
          from release.build_manifest import private_key
          actual = private_key(os.environ["DESKTOP_ED25519_PRIVATE_KEY_B64"]).public_key().public_bytes(
              serialization.Encoding.Raw,
              serialization.PublicFormat.Raw,
          )
          expected = base64.b64decode(os.environ["DESKTOP_ED25519_PUBLIC_KEY_B64"], validate=True)
          if not secrets.compare_digest(actual, expected):
              raise SystemExit("configured release public key does not match signing key")
          print("RELEASE_KEYPAIR_OK")
          PY
      - name: Prove the Linux public key matches the signing key
        run: |
          private_ring=$(mktemp -d)
          public_ring=$(mktemp -d)
          chmod 700 "$private_ring" "$public_ring"
          printf '%s' "$LINUX_PACKAGE_SIGNING_PRIVATE_KEY_B64" | base64 --decode | gpg --homedir "$private_ring" --batch --import
          printf '%s' "$LINUX_PACKAGE_SIGNING_PUBLIC_KEY_B64" | base64 --decode | gpg --homedir "$public_ring" --batch --import
          gpg --homedir "$private_ring" --batch --export "$LINUX_PACKAGE_SIGNING_KEY_ID" > "$RUNNER_TEMP/private-derived-public.gpg"
          gpg --homedir "$public_ring" --batch --export "$LINUX_PACKAGE_SIGNING_KEY_ID" > "$RUNNER_TEMP/configured-public.gpg"
          cmp "$RUNNER_TEMP/private-derived-public.gpg" "$RUNNER_TEMP/configured-public.gpg"
          rm -r -- "$private_ring" "$public_ring"
          rm -f -- "$RUNNER_TEMP/private-derived-public.gpg" "$RUNNER_TEMP/configured-public.gpg"
          echo "LINUX_RELEASE_KEYPAIR_OK"

  stable-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.channel == 'stable'
    needs: stable-signing-gate
    runs-on: windows-latest
    environment: desktop-stable-release
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      KEY_ID: ${{ secrets.DESKTOP_ED25519_KEY_ID }}
      PUBLIC_KEY_B64: ${{ secrets.DESKTOP_ED25519_PUBLIC_KEY_B64 }}
      CERT_B64: ${{ secrets.WINDOWS_CODESIGN_CERT_PFX_B64 }}
      CERT_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERT_PASSWORD }}
      WINDOWS_SUBJECT: ${{ secrets.WINDOWS_CODESIGN_SUBJECT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - shell: powershell
        run: |
          $body = "PINNED_RELEASE_KEYS = {`"$env:KEY_ID`": `"$env:PUBLIC_KEY_B64`"}`nPINNED_LINUX_PACKAGE_PUBLIC_KEY_B64 = `"`"`n"
          Set-Content desktop/agent/src/dreameros_agent/trusted_keys.py $body -Encoding utf8
      - run: python -m pip install -e desktop/agent -r release/requirements-build.txt
      - run: python -m unittest discover -s desktop/agent/tests -v
      - run: python release/test_build_manifest.py
      - run: pyinstaller --clean --onefile --name dreameros-agent --paths desktop/agent/src desktop/agent/build_entry.py
      - shell: powershell
        run: |
          [IO.File]::WriteAllBytes("desktop-signing.pfx", [Convert]::FromBase64String($env:CERT_B64))
          $securePassword = ConvertTo-SecureString $env:CERT_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath "desktop-signing.pfx" -CertStoreLocation "Cert:\CurrentUser\My" -Password $securePassword
          if (-not $cert) { throw "certificate import failed" }
          if ($cert.Subject -notlike "*$env:WINDOWS_SUBJECT*") { throw "certificate subject mismatch" }
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Where-Object FullName -Match '\\x64\\' | Select-Object -Last 1
          if (-not $signtool) { throw "signtool not found" }
          try {
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /sha1 $cert.Thumbprint dist/dreameros-agent.exe
            if ($LASTEXITCODE -ne 0) { throw "binary signing failed" }
            choco install innosetup --no-progress -y
            & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' release\windows\installer.iss "/DAppVersion=$env:RELEASE_VERSION" "/DSourceExe=$pwd\dist\dreameros-agent.exe" "/DOutputDir=$pwd\dist\package"
            if ($LASTEXITCODE -ne 0) { throw "installer build failed" }
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /sha1 $cert.Thumbprint dist/package/DreamerOSAgentSetup.exe
            if ($LASTEXITCODE -ne 0) { throw "installer signing failed" }
          } finally {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath "desktop-signing.pfx" -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stable-windows
          path: dist/package/DreamerOSAgentSetup.exe
          if-no-files-found: error

  stable-macos:
    if: github.event_name == 'workflow_dispatch' && inputs.channel == 'stable'
    needs: stable-signing-gate
    runs-on: macos-14
    environment: desktop-stable-release
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      KEY_ID: ${{ secrets.DESKTOP_ED25519_KEY_ID }}
      PUBLIC_KEY_B64: ${{ secrets.DESKTOP_ED25519_PUBLIC_KEY_B64 }}
      APP_CERT_B64: ${{ secrets.APPLE_APPLICATION_CERT_P12_B64 }}
      APP_CERT_PASSWORD: ${{ secrets.APPLE_APPLICATION_CERT_PASSWORD }}
      APP_IDENTITY: ${{ secrets.APPLE_APPLICATION_SIGNING_IDENTITY }}
      INSTALLER_CERT_B64: ${{ secrets.APPLE_INSTALLER_CERT_P12_B64 }}
      INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
      INSTALLER_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      NOTARY_PRIVATE_KEY_B64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_B64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -c 'import os,pathlib; pathlib.Path("desktop/agent/src/dreameros_agent/trusted_keys.py").write_text("PINNED_RELEASE_KEYS = "+repr({os.environ["KEY_ID"]:os.environ["PUBLIC_KEY_B64"]})+"\nPINNED_LINUX_PACKAGE_PUBLIC_KEY_B64 = \"\"\n")'
      - run: python -m pip install -e desktop/agent -r release/requirements-build.txt
      - run: python -m unittest discover -s desktop/agent/tests -v
      - run: python release/test_build_manifest.py
      - run: pyinstaller --clean --onefile --name dreameros-agent --paths desktop/agent/src desktop/agent/build_entry.py
      - run: |
          KEYCHAIN="$RUNNER_TEMP/dreameros.keychain-db"
          security create-keychain -p build "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p build "$KEYCHAIN"
          umask 077
          echo "$APP_CERT_B64" | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "$INSTALLER_CERT_B64" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          openssl pkcs12 -in "$RUNNER_TEMP/app.p12" -passin env:APP_CERT_PASSWORD -nodes -out "$RUNNER_TEMP/app.pem"
          openssl pkcs12 -in "$RUNNER_TEMP/installer.p12" -passin env:INSTALLER_CERT_PASSWORD -nodes -out "$RUNNER_TEMP/installer.pem"
          security import "$RUNNER_TEMP/app.pem" -k "$KEYCHAIN" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/installer.pem" -k "$KEYCHAIN" -T /usr/bin/productsign
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k build "$KEYCHAIN"
          codesign --force --options runtime --timestamp --sign "$APP_IDENTITY" dist/dreameros-agent
          mkdir -p dist/pkgroot/usr/local/bin dist/package
          cp dist/dreameros-agent dist/pkgroot/usr/local/bin/dreameros-agent
          chmod +x release/macos/scripts/postinstall
          pkgbuild --root dist/pkgroot --scripts release/macos/scripts --identifier app.dreameros.desktop-agent --version "$RELEASE_VERSION" "$RUNNER_TEMP/unsigned.pkg"
          productsign --sign "$INSTALLER_IDENTITY" "$RUNNER_TEMP/unsigned.pkg" dist/package/DreamerOSAgent.pkg
          umask 077
          printf '%s' "$NOTARY_PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit dist/package/DreamerOSAgent.pkg --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          rm -f "$RUNNER_TEMP/notary.p8"
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12" "$RUNNER_TEMP/app.pem" "$RUNNER_TEMP/installer.pem"
          xcrun stapler staple dist/package/DreamerOSAgent.pkg
          pkgutil --check-signature dist/package/DreamerOSAgent.pkg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stable-macos
          path: dist/package/DreamerOSAgent.pkg
          if-no-files-found: error

  stable-linux:
    if: github.event_name == 'workflow_dispatch' && inputs.channel == 'stable'
    needs: stable-signing-gate
    runs-on: ubuntu-latest
    environment: desktop-stable-release
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      KEY_ID: ${{ secrets.DESKTOP_ED25519_KEY_ID }}
      PUBLIC_KEY_B64: ${{ secrets.DESKTOP_ED25519_PUBLIC_KEY_B64 }}
      PACKAGE_KEY_B64: ${{ secrets.LINUX_PACKAGE_SIGNING_PRIVATE_KEY_B64 }}
      PACKAGE_PUBLIC_KEY_B64: ${{ secrets.LINUX_PACKAGE_SIGNING_PUBLIC_KEY_B64 }}
      PACKAGE_KEY_ID: ${{ secrets.LINUX_PACKAGE_SIGNING_KEY_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -c 'import os,pathlib; pathlib.Path("desktop/agent/src/dreameros_agent/trusted_keys.py").write_text("PINNED_RELEASE_KEYS = "+repr({os.environ["KEY_ID"]:os.environ["PUBLIC_KEY_B64"]})+"\nPINNED_LINUX_PACKAGE_PUBLIC_KEY_B64 = "+repr(os.environ["PACKAGE_PUBLIC_KEY_B64"])+"\n")'
      - run: python -m pip install -e desktop/agent -r release/requirements-build.txt
      - run: python -m unittest discover -s desktop/agent/tests -v
      - run: python release/test_build_manifest.py
      - run: pyinstaller --clean --onefile --name dreameros-agent --paths desktop/agent/src desktop/agent/build_entry.py
      - run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-sig
          echo "$PACKAGE_KEY_B64" | base64 --decode | gpg --batch --import
          mkdir -p dist/debroot/DEBIAN dist/debroot/usr/local/bin dist/debroot/usr/share/applications dist/package
          cp dist/dreameros-agent dist/debroot/usr/local/bin/dreameros-agent
          printf 'Package: dreameros-desktop-agent\nVersion: %s\nArchitecture: amd64\nMaintainer: DreamerOS\nDepends: gnupg, libsecret-tools, policykit-1, dpkg-sig\nDescription: DreamerOS desktop MCP conductor\n' "$RELEASE_VERSION" > dist/debroot/DEBIAN/control
          cp release/linux/postinst dist/debroot/DEBIAN/postinst
          cp release/linux/dreameros-agent.desktop dist/debroot/usr/share/applications/dreameros-agent.desktop
          chmod 755 dist/debroot/DEBIAN/postinst
          dpkg-deb --build dist/debroot "dist/package/dreameros-desktop-agent_${RELEASE_VERSION}_amd64.deb"
          dpkg-sig --sign builder -k "$PACKAGE_KEY_ID" "dist/package/dreameros-desktop-agent_${RELEASE_VERSION}_amd64.deb"
          dpkg-sig --verify "dist/package/dreameros-desktop-agent_${RELEASE_VERSION}_amd64.deb"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stable-linux
          path: dist/package/dreameros-desktop-agent_${{ inputs.version }}_amd64.deb
          if-no-files-found: error

  publish-stable:
    if: github.event_name == 'workflow_dispatch' && inputs.channel == 'stable'
    needs: [stable-windows, stable-macos, stable-linux]
    runs-on: ubuntu-latest
    environment: desktop-stable-release
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      MANIFEST_PRIVATE_KEY_B64: ${{ secrets.DESKTOP_ED25519_PRIVATE_KEY_B64 }}
      MANIFEST_KEY_ID: ${{ secrets.DESKTOP_ED25519_KEY_ID }}
      WINDOWS_SUBJECT: ${{ secrets.WINDOWS_CODESIGN_SUBJECT }}
      LINUX_KEY_ID: ${{ secrets.LINUX_PACKAGE_SIGNING_KEY_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: stable-*
          path: dist/release
          merge-multiple: true
      - run: |
          python -m pip install cryptography==50.0.0
          cd bootpack/out && zip -r ../../dist/release/dreameros-bootpack.zip .
          cd ../..
          python release/build_manifest.py \
            --asset-dir dist/release \
            --version "$RELEASE_VERSION" \
            --tag "desktop-v$RELEASE_VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --bootpack-source bootpack/SOURCE-dreameros-boot-canon.md \
            --key-id "$MANIFEST_KEY_ID" \
            --private-key-env MANIFEST_PRIVATE_KEY_B64 \
            --windows-subject "$WINDOWS_SUBJECT" \
            --linux-key-id "$LINUX_KEY_ID"
          PYTHONPATH=desktop/agent/src python -c 'import json,pathlib; from dreameros_agent.release_manifest import verify_manifest; p=pathlib.Path("dist/release"); pub=json.loads((p/"release-public-key.json").read_text()); verify_manifest((p/"release-manifest.json").read_bytes(),(p/"release-manifest.sig").read_text(),{pub["key_id"]:pub["public_key_b64"]})'
      - run: |
          gh release create "desktop-v$RELEASE_VERSION" dist/release/* \
            --target "$GITHUB_SHA" \
            --title "DreamerOS Desktop Agent $RELEASE_VERSION" \
            --notes "Signed installers for Windows, macOS, and Linux. The release manifest is Ed25519 signed."
