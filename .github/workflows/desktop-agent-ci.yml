name: Desktop Agent CI

on:
  pull_request:
    paths:
      - "desktop/**"
      - "release/**"
      - "bootpack/**"
      - ".cursor-plugin/**"
      - "cursor/**"
      - "install/claude-code/**"
      - "install/codex/**"
      - "install/cursor/**"
      - "install/easy-button/**"
      - "skills/**"
      - "scripts/validate.py"
      - "gates/**"
      - "plugin.json"
      - "mcp.json"
      - ".mcp.json"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".claude/**"
      - ".codex/**"
      - ".cursor/**"
      - "README.md"
      - ".gitattributes"
      - ".github/workflows/desktop-agent-ci.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "release/**"
      - "bootpack/**"
      - ".cursor-plugin/**"
      - "cursor/**"
      - "install/claude-code/**"
      - "install/codex/**"
      - "install/cursor/**"
      - "install/easy-button/**"
      - "skills/**"
      - "scripts/validate.py"
      - "gates/**"
      - "plugin.json"
      - "mcp.json"
      - ".mcp.json"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".claude/**"
      - ".codex/**"
      - ".cursor/**"
      - "README.md"
      - ".gitattributes"
      - ".github/workflows/desktop-agent-ci.yml"

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate.py
      - run: python install/claude-code/tests/policy_setup_test.py
      - run: python -m unittest gates.test_gateway_lockstep -v
      - run: python -m unittest discover -s install/codex/tests -p "test_*.py" -v
      - run: python -m pip install -e desktop/agent
      - run: python -m unittest discover -s desktop/agent/tests -v
      - shell: powershell
        run: ./bootpack/build-boot-pack.ps1 -Verify
      - shell: pwsh
        run: ./bootpack/build-boot-pack.ps1 -Verify
      - shell: powershell
        run: |
          [void][ScriptBlock]::Create((Get-Content -Raw -LiteralPath './install/cursor/install.ps1'))
          [void][ScriptBlock]::Create((Get-Content -Raw -LiteralPath './install/cursor/sync-project-rules.ps1'))
          [void][ScriptBlock]::Create((Get-Content -Raw -LiteralPath './install/cursor/restore-project-rules.ps1'))
          [void][ScriptBlock]::Create((Get-Content -Raw -LiteralPath './install/cursor/audit-project-boot-surfaces.ps1'))
          [void][ScriptBlock]::Create((Get-Content -Raw -LiteralPath './install/cursor/audit-project-client-oauth.ps1'))
          [void][ScriptBlock]::Create((Get-Content -Raw -LiteralPath './install/cursor/plan-project-migration.ps1'))
          [void][ScriptBlock]::Create((Get-Content -Raw -LiteralPath './install/cursor/render-project-migration-diffs.ps1'))
          [void][ScriptBlock]::Create((Get-Content -Raw -LiteralPath './install/cursor/tests/install.tests.ps1'))
          [void][ScriptBlock]::Create((Get-Content -Raw -LiteralPath './install/cursor/tests/sync-project-rules.tests.ps1'))
          [void][ScriptBlock]::Create((Get-Content -Raw -LiteralPath './install/cursor/tests/audit-project-boot-surfaces.tests.ps1'))
          [void][ScriptBlock]::Create((Get-Content -Raw -LiteralPath './install/cursor/tests/audit-project-client-oauth.tests.ps1'))
          [void][ScriptBlock]::Create((Get-Content -Raw -LiteralPath './install/cursor/tests/plan-project-migration.tests.ps1'))
          [void][ScriptBlock]::Create((Get-Content -Raw -LiteralPath './install/cursor/tests/render-project-migration-diffs.tests.ps1'))
          [void][ScriptBlock]::Create((Get-Content -Raw -LiteralPath './bootpack/tests/build-installed.tests.ps1'))
          [void][ScriptBlock]::Create((Get-Content -Raw -LiteralPath './bootpack/tests/codex-hook-install.tests.ps1'))
          [void][ScriptBlock]::Create((Get-Content -Raw -LiteralPath './install/claude-code/tests/settings-merge.tests.ps1'))
          [void][ScriptBlock]::Create((Get-Content -Raw -LiteralPath './install/claude-code/tests/managed-agent-merge.tests.ps1'))
      - shell: powershell
        run: ./bootpack/tests/build-installed.tests.ps1
      - shell: powershell
        run: ./bootpack/tests/codex-hook-install.tests.ps1
      - shell: pwsh
        run: ./bootpack/tests/codex-hook-install.tests.ps1
      - shell: powershell
        run: ./install/claude-code/tests/settings-merge.tests.ps1
      - shell: pwsh
        run: ./install/claude-code/tests/settings-merge.tests.ps1
      - shell: powershell
        run: ./install/claude-code/tests/managed-agent-merge.tests.ps1
      - shell: pwsh
        run: ./install/claude-code/tests/managed-agent-merge.tests.ps1

  # Cursor installer tests: about 6 of the 8.5 minutes on 2026-09-16. They run
  # in their own job, in parallel, and on a pull request only when a file they
  # cover changed. Pushes to main always run them.
  cursor-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD"             | grep -Eq '^(install/cursor/|cursor/|\.cursor-plugin/|\.cursor/|bootpack/|scripts/validate\.py$|\.github/workflows/desktop-agent-ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No Cursor-covered file changed; Cursor tests skipped."
          fi
      - shell: powershell
        if: steps.changes.outputs.run == 'true'
        run: ./install/cursor/tests/install.tests.ps1
      - shell: powershell
        if: steps.changes.outputs.run == 'true'
        run: ./install/cursor/tests/sync-project-rules.tests.ps1
      - shell: pwsh
        if: steps.changes.outputs.run == 'true'
        run: ./install/cursor/tests/sync-project-rules.tests.ps1
      - shell: powershell
        if: steps.changes.outputs.run == 'true'
        run: ./install/cursor/tests/audit-project-boot-surfaces.tests.ps1
      - shell: pwsh
        if: steps.changes.outputs.run == 'true'
        run: ./install/cursor/tests/audit-project-boot-surfaces.tests.ps1
      - shell: powershell
        if: steps.changes.outputs.run == 'true'
        run: ./install/cursor/tests/audit-project-client-oauth.tests.ps1
      - shell: pwsh
        if: steps.changes.outputs.run == 'true'
        run: ./install/cursor/tests/audit-project-client-oauth.tests.ps1
      - shell: powershell
        if: steps.changes.outputs.run == 'true'
        run: ./install/cursor/tests/plan-project-migration.tests.ps1
      - shell: pwsh
        if: steps.changes.outputs.run == 'true'
        run: ./install/cursor/tests/plan-project-migration.tests.ps1
      - shell: powershell
        if: steps.changes.outputs.run == 'true'
        run: ./install/cursor/tests/render-project-migration-diffs.tests.ps1
      - shell: pwsh
        if: steps.changes.outputs.run == 'true'
        run: ./install/cursor/tests/render-project-migration-diffs.tests.ps1
